name: 晨间计划推送

on:
  schedule:
    # 每天 UTC 23:00 = 北京时间 7:00 (次日)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  send-plan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 发送晨间计划
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python scripts/send_plan.py
